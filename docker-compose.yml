version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: claro-otp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - otp-network

  app:
    build: .
    container_name: claro-otp-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - OTP_EXPIRATION_SECONDS=300
      - OTP_REQUEST_COOLDOWN_SECONDS=60
    depends_on:
      - redis
    networks:
      - otp-network

volumes:
  redis-data:

networks:
  otp-network:
    driver: bridge
